name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble index.html from base64 parts
        run: |
          set -e
          mkdir -p _site
          : > /tmp/index.b64
          for i in $(seq -w 1 16); do
            cat ".deploy/index.b64.${i}" >> /tmp/index.b64
          done
          base64 -d /tmp/index.b64 > _site/index.html
          echo "reassembled bytes: $(wc -c < _site/index.html)"
          head -c 80 _site/index.html; echo

      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          path: _site
